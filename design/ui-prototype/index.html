<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="每日开口新概念英语学习 App 完整 UI 交互设计稿，清晨留白风格">
  <title>每日开口 · 清晨留白完整 UI 设计稿</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="prototype-shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 5.5h13a5 5 0 0 1 5 5v8a5 5 0 0 1-5 5h-8l-6 4v-4.8A5 5 0 0 1 2 18V10.5a5 5 0 0 1 5-5Z"/><path d="M9 13h10M9 17h6"/></svg>
        <div><strong>每日开口</strong><span>清晨留白 · UI 设计稿</span></div>
      </div>
      <div class="side-meta"><span>PRD v2.5.3</span><span>46 个页面状态</span></div>
      <label class="screen-select-label" for="screenSelect">选择页面</label>
      <select id="screenSelect" class="screen-select"></select>
      <nav class="screen-nav" id="screenNav" aria-label="页面清单"></nav>
      <div class="side-foot"><i></i>设计稿预览，非真实学习数据</div>
    </aside>

    <main class="workspace">
      <header class="workspace-header">
        <button class="menu-button" id="menuButton" type="button" aria-label="打开页面清单" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="page-heading"><span id="pageGroup">今日与课程</span><h1 id="pageTitle">今日</h1></div>
        <div class="page-controls">
          <button id="prevPage" type="button" aria-label="上一页"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
          <span id="pageCounter">09 / 46</span>
          <button id="nextPage" type="button" aria-label="下一页"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
      </header>

      <section class="preview-stage">
        <div class="stage-note left-note"><span>设计原则</span><p>一次只看当前内容<br>让开口比分数更重要</p></div>
        <div class="device" id="device" aria-live="polite"></div>
        <div class="stage-note right-note"><span>当前风格</span><p>薄荷绿 · 温暖插画<br>清晰层级 · 充足留白</p><div class="mini-palette"><i></i><i></i><i></i></div></div>
      </section>
      <footer class="workspace-footer"><span>Android 手机 · 390 × 844</span><span>点击手机内按钮可体验流程</span></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="nav-backdrop" id="navBackdrop"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
