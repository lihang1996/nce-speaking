<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日开口 · 新视觉方案 · 核心页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link rel="stylesheet" href="./src/v2/style.css">
</head>
<body>
<main class="board">
  <header class="board-head">
    <div>
      <h1>每日开口 · 新视觉方案</h1>
      <p>核心页 6 屏加“学习颜色”设置，按真实 390 × 844 尺寸绘制。四种学习活动各用一种颜色：听（蓝）、说（珊瑚）、练（紫）、复习（绿），用户可以在设置里换；英文课文用衬线字体，主按钮统一为黑色。</p>
    </div>
    <span class="tag">PRD v2.5.5 · 第二轮</span>
  </header>
  <section class="screens" id="screens"></section>
  <section id="spec"></section>
</main>
<script type="module">
import { screens, spec, PALETTES, CVD } from './src/v2/screens.js';
const only = new URLSearchParams(location.search).get('only');
const list = only ? screens.filter(s => only.split(',').includes(s.id)) : screens;
if (only === 'spec') document.getElementById('screens').remove();
document.getElementById('screens')?.insertAdjacentHTML('beforeend', list.map(s => `<div><p class="cap"><b>${s.name}</b> · ${s.note}</p>${s.render()}</div>`).join(''));
if (!only || only === 'spec') document.getElementById('spec').innerHTML = spec();
// 学习颜色：点预设实时改全局颜色变量，所有屏幕一起变
const root = document.documentElement;
const DEF = Object.fromEntries(Object.entries(PALETTES).map(([k, list]) => [k, list[0].slice(1)]));
const toVals = v => (v.length === 5 ? v.slice(1) : v);
function apply(k, vals) {
  ['', '-tint', '-line', '-deep'].forEach((suffix, i) => root.style.setProperty(`--${k}${suffix}`, vals[i]));
  document.querySelectorAll(`.tone[data-k="${k}"]`).forEach(b => b.classList.toggle('on', b.dataset.v === vals.join(',')));
}
document.addEventListener('click', e => {
  const tone = e.target.closest('.tone');
  if (tone) { apply(tone.dataset.k, tone.dataset.v.split(',')); document.querySelector('[data-cvd] .switch')?.classList.remove('on'); return; }
  if (e.target.closest('[data-reset]')) { Object.entries(DEF).forEach(([k, v]) => apply(k, v)); document.querySelector('[data-cvd] .switch')?.classList.remove('on'); return; }
  const row = e.target.closest('[data-cvd]');
  if (row) { const sw = row.querySelector('.switch'); const on = !sw.classList.contains('on'); sw.classList.toggle('on', on); Object.entries(on ? CVD : DEF).forEach(([k, v]) => apply(k, toVals(v))); }
});
</script>
</body>
</html>
